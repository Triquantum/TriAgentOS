name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # No cache — avoids lock file requirement on first run

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate registries
        run: node tools/score-engine/validate-registry.js

      - name: Smoke test — version
        run: node cli/bin/tri.js --version

      - name: Smoke test — boot
        run: node cli/bin/tri.js boot --json
        env:
          CI: true

      - name: Smoke test — app list
        run: node cli/bin/tri.js app list

      - name: Smoke test — skill list
        run: node cli/bin/tri.js skill list
