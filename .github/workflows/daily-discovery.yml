name: Daily AI Discovery

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run discovery scan
        run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild README
        run: npm run build:readme
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TriAgentOS Bot"
          git add registry/repos.json README.md || true
          git diff --staged --quiet || git commit -m "🤖 Daily AI discovery $(date +'%Y-%m-%d')"
          git push || true
